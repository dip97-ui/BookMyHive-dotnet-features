spring.application.name=bookmyhive
server.port=8080

# ---- MySQL (override with env vars DB_URL / DB_USERNAME / DB_PASSWORD) ----
spring.datasource.url=jdbc:mysql://localhost:3306/bookmyhive?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT (REQUIRED: set JWT_SECRET env var, at least 32 characters; no default shipped) ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ---- CORS (React dev server) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Seed demo data on first start ----
app.seed.enabled=${SEED_ENABLED:true}
# Seeded demo-login passwords. Defaults are for local dev only; set both env vars on any public deployment.
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
app.seed.user-password=${SEED_USER_PASSWORD:User@123}

# ---- TMDB API (The Movie Database) ----
# REQUIRED: set TMDB_API_KEY env var to your own TMDB API v3 key (32 hex chars) or v4 read access token
tmdb.api.key=${TMDB_API_KEY}
tmdb.api.url=https://api.themoviedb.org/3
tmdb.image.base-url=https://image.tmdb.org/t/p
tmdb.region=IN
tmdb.sync.on-startup=true
